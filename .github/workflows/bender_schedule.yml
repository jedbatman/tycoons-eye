name: Bender Scheduled Alerts

permissions:
  contents: read

on:
  # ============================================================
  # MANUAL TEST
  # ============================================================
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Manual test mode"
        required: true
        default: "MORNING"
        type: choice
        options:
          - MORNING
          - NIGHT

  # ============================================================
  # TEMPORARY AUTOMATIC TEST
  #
  # Tatakbo kada 5 minutes.
  # Example:
  # 10:05, 10:10, 10:15, 10:20...
  #
  # PAG MAY ISANG AUTOMATIC TELEGRAM MESSAGE NA DUMATING,
  # AALISIN NATIN ITO AT IBABALIK SA 8:17 AM / 10:17 PM.
  # ============================================================
  schedule:
    - cron: "*/5 * * * *"


concurrency:
  group: bender-scheduled-scan
  cancel-in-progress: false


jobs:

  bender-scan:

    name: Run Bender Market Scanner

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ========================================================
      # 1. KUNIN ANG FILES NG REPOSITORY
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. IHANDA ANG PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ========================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy requests


      # ========================================================
      # 4. DETERMINE SCAN MODE
      # ========================================================
      - name: Determine scan mode
        shell: bash
        run: |

          echo "========================================"
          echo "🤖 BENDER TRIGGER INFORMATION"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "========================================"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual test detected."
            echo "SCAN_MODE=${{ inputs.scan_mode }}" >> "$GITHUB_ENV"

          elif [ "${{ github.event_name }}" = "schedule" ]; then

            echo "✅ AUTOMATIC CRON TRIGGER DETECTED."
            echo "SCAN_MODE=MORNING" >> "$GITHUB_ENV"

          else

            echo "Unknown trigger."
            echo "SCAN_MODE=MANUAL" >> "$GITHUB_ENV"

          fi


      # ========================================================
      # 5. RUN BENDER
      # ========================================================
      - name: Run Bender scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_PHP: "560000"

        run: |

          echo "========================================"
          echo "🤖 BENDER IS WAKING UP"
          echo "Scan mode: $SCAN_MODE"
          echo "========================================"

          python scheduled_scan.py

          echo "========================================"
          echo "✅ BENDER FINISHED SUCCESSFULLY"
          echo "========================================"
