name: Bender Scheduled Alerts

permissions:
  contents: read

on:
  # ============================================================
  # MANUAL TEST
  # ============================================================
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Manual test mode"
        required: true
        default: "MORNING"
        type: choice
        options:
          - MORNING
          - NIGHT

  # ============================================================
  # AUTOMATIC SCHEDULE
  # Philippines = UTC + 8
  # ============================================================
  schedule:

    # 🧪 TEMPORARY AUTOMATION TEST
    # 9:50 AM Philippines = 01:50 UTC
    - cron: "50 1 * * *"

    # ☀️ MAIN DAILY REPORT
    # 8:17 AM Philippines = 00:17 UTC
    - cron: "17 0 * * *"

    # 🌙 NIGHT RISK CHECK
    # 10:17 PM Philippines = 14:17 UTC
    - cron: "17 14 * * *"


jobs:

  bender-scan:

    name: Run Bender Market Scanner

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ========================================================
      # 1. KUNIN ANG FILES NG REPOSITORY
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ========================================================
      # 2. IHANDA ANG PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # ========================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy requests


      # ========================================================
      # 4. ALAMIN KUNG ANONG URI NG SCAN
      # ========================================================
      - name: Determine scan mode
        shell: bash

        run: |

          echo "========================================"
          echo "EVENT NAME: ${{ github.event_name }}"
          echo "SCHEDULE: ${{ github.event.schedule }}"
          echo "========================================"

          # MANUAL RUN
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual GitHub run detected."
            echo "SCAN_MODE=${{ inputs.scan_mode }}" >> "$GITHUB_ENV"


          # 🧪 TEMPORARY 9:50 AM AUTOMATIC TEST
          elif [ "${{ github.event.schedule }}" = "50 1 * * *" ]; then

            echo "AUTOMATIC 9:50 AM TEST TRIGGERED."
            echo "SCAN_MODE=MORNING" >> "$GITHUB_ENV"


          # ☀️ NORMAL 8:17 AM REPORT
          elif [ "${{ github.event.schedule }}" = "17 0 * * *" ]; then

            echo "Automatic 8:17 AM MORNING scan detected."
            echo "SCAN_MODE=MORNING" >> "$GITHUB_ENV"


          # 🌙 NORMAL 10:17 PM REPORT
          elif [ "${{ github.event.schedule }}" = "17 14 * * *" ]; then

            echo "Automatic 10:17 PM NIGHT scan detected."
            echo "SCAN_MODE=NIGHT" >> "$GITHUB_ENV"


          else

            echo "Unknown trigger."
            echo "SCAN_MODE=MANUAL" >> "$GITHUB_ENV"

          fi


      # ========================================================
      # 5. PATUBUHIN SI BENDER
      # ========================================================
      - name: Run Bender scanner

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          CAPITAL_PHP: "560000"


        run: |

          echo "========================================"

          echo "🤖 BENDER IS WAKING UP"

          echo "Scan mode: $SCAN_MODE"

          echo "========================================"

          python scheduled_scan.py

          echo "========================================"

          echo "✅ BENDER FINISHED SUCCESSFULLY"

          echo "========================================"
