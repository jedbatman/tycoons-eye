name: Bender Scheduler Test

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  scheduler-test:
    runs-on: ubuntu-latest

    steps:
      - name: Automatic scheduler heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import os
          import requests
          from datetime import datetime, timezone, timedelta

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          ph_time = datetime.now(
              timezone(timedelta(hours=8))
          ).strftime("%Y-%m-%d %I:%M:%S %p")

          message = (
              "🧪 BENDER CRON TEST\n\n"
              "✅ GitHub automatic scheduler woke up by itself.\n"
              f"🕒 Philippine Time: {ph_time}\n\n"
              "Walang manual Run Workflow na pinindot para sa message na ito."
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          r = requests.post(
              url,
              json={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=20
          )

          r.raise_for_status()

          print("Telegram cron test sent successfully.")
          PY
